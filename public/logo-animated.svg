<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Keyframe definitions */
    @keyframes drawBridge {
      to {
        stroke-dashoffset: 0;
      }
    }
    @keyframes scalePillarLeft {
      0% {
        transform: translateY(100px) scale(0.8);
        opacity: 0;
      }
      100% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }
    @keyframes scalePillarRight {
      0% {
        transform: translateY(100px) scale(0.8);
        opacity: 0;
      }
      100% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }
    @keyframes fadeInNode {
      0% {
        transform: scale(0);
        opacity: 0;
      }
      70% {
        transform: scale(1.2);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }
    @keyframes gradientShift {
      0% {
        stop-color: #5B2DEE;
      }
      50% {
        stop-color: #09C95B;
      }
      100% {
        stop-color: #5B2DEE;
      }
    }
    @keyframes gradientShiftRight {
      0% {
        stop-color: #09C95B;
      }
      50% {
        stop-color: #5B2DEE;
      }
      100% {
        stop-color: #09C95B;
      }
    }

    /* Target class stylings */
    .bg-card {
      transform-origin: center;
      transition: transform 0.5s ease;
    }
    .pillar-left {
      transform-origin: 245px 510px;
      animation: scalePillarLeft 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
    }
    .pillar-right {
      transform-origin: 778px 510px;
      animation: scalePillarRight 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s forwards;
      opacity: 0;
    }
    .node-left {
      transform-origin: 442px 550px;
      animation: fadeInNode 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s forwards;
      opacity: 0;
    }
    .node-right {
      transform-origin: 581px 550px;
      animation: fadeInNode 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.65s forwards;
      opacity: 0;
    }
    .bridge-line {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: drawBridge 1.2s cubic-bezier(0.4, 0, 0.2, 1) 0.3s forwards;
    }
    .stop-1 {
      animation: gradientShift 6s infinite alternate;
    }
    .stop-2 {
      animation: gradientShiftRight 6s infinite alternate;
    }
  </style>

