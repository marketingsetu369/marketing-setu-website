<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" width="1120" height="320">
  <!-- Left Emblem -->
  <g transform="translate(-80, -45)">
    <!-- Bridge Structure -->
    <g class="bridge-structure">
      <path d="M280 108 H298 L303 252 H275 Z" fill="#003058" />
      <path d="M342 108 H360 L365 232 H337 Z" fill="#003058" />
      <rect x="290" y="136" width="60" height="13" rx="2" fill="#003058" />
      <rect x="288" y="174" width="64" height="10" rx="2" fill="#003058" />
      <path d="M165 262 H300 L368 244" fill="none" stroke="#003058" stroke-width="9" stroke-linecap="round" />
    </g>

    <!-- Cables -->
    <path class="bridge-cable" d="M170 258 C225 235, 268 182, 288 114" fill="none" stroke="#003058" stroke-width="7" stroke-linecap="round" />
    <path class="bridge-cable" d="M288 114 C308 178, 332 178, 351 114" fill="none" stroke="#003058" stroke-width="6.5" stroke-linecap="round" />
    <path class="bridge-cable" d="M351 114 C372 178, 408 214, 452 225" fill="none" stroke="#003058" stroke-width="6.5" stroke-linecap="round" />

    <!-- Suspenders -->
    <g class="suspender-line" stroke="#003058" stroke-width="3.5" stroke-linecap="round">
      <line x1="205" y1="244" x2="205" y2="262" />
      <line x1="228" y1="226" x2="228" y2="262" />
      <line x1="250" y1="198" x2="250" y2="262" />
      <line x1="272" y1="156" x2="272" y2="262" />
      <line x1="312" y1="152" x2="312" y2="242" />
      <line x1="330" y1="152" x2="330" y2="236" />
      <line x1="375" y1="158" x2="375" y2="226" />
      <line x1="398" y1="184" x2="398" y2="224" />
      <line x1="420" y1="206" x2="420" y2="224" />
    </g>

    <!-- Rising Bars -->
    <rect class="growth-bar bar-1" x="424" y="174" width="22" height="52" rx="3.5" fill="#089848" />
    <rect class="growth-bar bar-2" x="456" y="148" width="22" height="72" rx="3.5" fill="#089848" />
    <rect class="growth-bar bar-3" x="488" y="118" width="22" height="92" rx="3.5" fill="#089848" />

    <!-- Dynamic Connecting Arrow -->
    <path
      d="M240 315 C295 250, 385 252, 460 228 C518 208, 560 174, 595 132 L574 122 L634 94 L626 158 L608 144 C568 196, 520 236, 450 258 C378 280, 318 276, 280 315 Z"
      fill="#089848"
    />
    <path
      d="M298 315 C330 278, 392 280, 460 258 C505 244, 540 222, 568 194 C546 228, 510 256, 458 273 C396 294, 350 290, 326 315 Z"
      fill="#003058"
    />
  </g>

  <!-- Typography: MARKETING SETU -->
  <g transform="translate(580, 160)">
    <text font-family="'Poppins', sans-serif" font-weight="800" font-size="64" letter-spacing="2">
      <tspan fill="#003058">MARKETING </tspan>
      <tspan fill="#089848">SETU</tspan>
    </text>
    <text y="54" font-family="'Inter', sans-serif" font-weight="600" font-size="20" fill="#003058" letter-spacing="3" opacity="0.85">
      “THE MARKETING BRIDGE”
    </text>
  </g>
</svg>
