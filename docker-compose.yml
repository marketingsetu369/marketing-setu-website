services:
  marketingsetu-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketingsetu-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=https://api.marketingsetu.com
      - NODE_OPTIONS=--max-old-space-size=384
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 150M
